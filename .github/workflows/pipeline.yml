name: YouTube Shorts Automation Pipeline

on:
  schedule:
    # 10:00 AM IST (04:30 UTC)
    - cron: "30 4 * * *"
    # 3:00 PM IST (09:30 UTC)
    - cron: "30 9 * * *"
    # 8:00 PM IST (14:30 UTC)
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Test notification only (Telegram/Slack ping without video processing)"
        required: false
        default: false
        type: boolean

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-freefont-ttf fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        if: ${{ !inputs.test_notify }}
        working-directory: scripts
        env:
          DRIVE_INCOMING_FOLDER_ID: ${{ secrets.DRIVE_INCOMING_FOLDER_ID }}
          DRIVE_PROCESSED_FOLDER_ID: ${{ secrets.DRIVE_PROCESSED_FOLDER_ID }}
          DRIVE_FAILED_FOLDER_ID: ${{ secrets.DRIVE_FAILED_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LOG_SHEET_ID: ${{ secrets.LOG_SHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py

      - name: Run test notification
        if: ${{ inputs.test_notify }}
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python notify.py "🤖 Test notification from YouTube Shorts Automation pipeline: Telegram alerts are working properly! 🎉"

